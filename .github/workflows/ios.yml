name: Release iOS

on:
  workflow_dispatch:

concurrency:
  group: release-ios
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
  PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
  BUNDLED_MODULES: bundled-modules/hongguo
  MODULE_INDEX_URLS: ${{ vars.MODULE_INDEX_URLS }}
  MODULE_INDEX_TOKEN: ${{ secrets.MODULE_SOURCE_TOKEN }}
  PYTHONUTF8: '1'
  PROJECT_URL: ${{ vars.PROJECT_URL }}
  TELEGRAM_GROUP_URL: ${{ vars.TELEGRAM_GROUP_URL }}
  TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
  VIDEOAPP_RELEASE_TOKEN: ${{ secrets.VIDEOAPP_RELEASE_TOKEN }}

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  ios:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout Hongguo module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gentoobreaking/video-src
          path: video-src
          token: ${{ secrets.MODULE_SOURCE_TOKEN != '' && secrets.MODULE_SOURCE_TOKEN || github.token }}
      - name: Stage Hongguo module
        run: mkdir -p bundled-modules && cp -r video-src/hongguo bundled-modules/hongguo
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Check Xcode and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version
          go version
          flutter --version
          flutter precache --ios
      - name: Build unsigned iOS packages
        run: python scripts/build_ios.py
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download iOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-unsigned
          path: release
      - name: Create iOS Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}-ios
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          版本 ${VERSION}。安裝包內置紅果站源，其餘站源在 設定 › 站源 › 模組管理 的模組商店安裝。

          iOS：
          - *-ios-unsigned.ipa：未簽名 IPA，可用相關工具安裝
          EOF
          changes="$(awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          printf '%s' "$changes" > changes.md
          if [ -z "$changes" ]; then
            echo "CHANGELOG.md 中找不到「## ${VERSION}」小節，拒絕發布沒有更新說明的版本。" >&2
            exit 1
          fi
          { printf '更新內容：\n\n%s\n\n' "$changes"; cat notes.md; } > notes.tmp
          mv notes.tmp notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "影片庫 ${VERSION} (iOS)" --notes-file notes.md
      - name: Notify Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && vars.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}-ios
        run: |
          set -euo pipefail
          changes="$(cat changes.md)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          text="影片庫 ${VERSION} (iOS) 已發布"
          if [ -n "$changes" ]; then
            text="$(printf '%s\n\n更新內容：\n\n%s' "$text" "${changes:0:3500}")"
          fi
          text="$(printf '%s\n\n下載：%s' "$text" "$url")"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null