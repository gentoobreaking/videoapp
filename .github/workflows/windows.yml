name: "Release Windows"

on:
  workflow_dispatch:

concurrency:
  group: release-windows
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
  PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
  BUNDLED_MODULES: bundled-modules/hongguo
  MODULE_INDEX_URLS: ${{ vars.MODULE_INDEX_URLS }}
  MODULE_INDEX_TOKEN: ${{ secrets.MODULE_SOURCE_TOKEN }}
  PYTHONUTF8: '1'
  PROJECT_URL: ${{ vars.PROJECT_URL }}
  TELEGRAM_GROUP_URL: ${{ vars.TELEGRAM_GROUP_URL }}
  TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
  VIDEOAPP_RELEASE_TOKEN: ${{ secrets.VIDEOAPP_RELEASE_TOKEN }}

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout Hongguo module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gentoobreaking/video-src
          path: video-src
          token: ${{ secrets.MODULE_SOURCE_TOKEN != '' && secrets.MODULE_SOURCE_TOKEN || github.token }}
      - name: Stage Hongguo module
        run: mkdir -p bundled-modules && cp -r video-src/hongguo bundled-modules/hongguo
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Set up MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $exe = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' `
                   -Recurse -Include 'x86_64-w64-mingw32-gcc.exe', 'gcc.exe' -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { $exe = (Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue).Source }
          if (-not $exe) { throw 'MinGW-w64 安裝失敗，找不到 gcc' }
          Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe --version | Select-Object -First 1
      - name: Set up Inno Setup
        shell: pwsh
        run: choco upgrade innosetup --no-progress -y
      - name: Build Windows
        run: python scripts/build_windows.py
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows
          path: release
      - name: Create Windows Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}-windows
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          版本 ${VERSION}。安裝包內置紅果站源，其餘站源在 設定 › 站源 › 模組管理 的模組商店安裝。

          Windows：
          - *-windows-x64-setup.exe：安裝包，默認安裝到當前用戶，無需管理員權限；安裝時可改為所有用戶
          - *-windows-x64.zip：便攜版，解壓後運行 videoapp.exe；設置、記錄、海報緩存和默認下載都保存在程序旁的 userdata 目錄，升級時把舊版的 userdata 目錄複製過來即可
          EOF
          changes="$(awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          printf '%s' "$changes" > changes.md
          if [ -z "$changes" ]; then
            echo "CHANGELOG.md 中找不到「## ${VERSION}」小節，拒絕發布沒有更新說明的版本。" >&2
            exit 1
          fi
          { printf '更新內容：\n\n%s\n\n' "$changes"; cat notes.md; } > notes.tmp
          mv notes.tmp notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "影片庫 ${VERSION} (Windows)" --notes-file notes.md
      - name: Notify Telegram
        if: secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}-windows
        run: |
          set -euo pipefail
          changes="$(cat changes.md)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          text="影片庫 ${VERSION} (Windows) 已發布"
          if [ -n "$changes" ]; then
            text="$(printf '%s\n\n更新內容：\n\n%s' "$text" "${changes:0:3500}")"
          fi
          text="$(printf '%s\n\n下載：%s' "$text" "$url")"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null