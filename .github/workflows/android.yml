name: Release Android

on:
  workflow_dispatch:

concurrency:
  group: release-android
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  UPDATE_SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
  PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
  BUNDLED_MODULES: bundled-modules/hongguo
  MODULE_INDEX_URLS: ${{ vars.MODULE_INDEX_URLS }}
  MODULE_INDEX_TOKEN: ${{ secrets.MODULE_SOURCE_TOKEN }}
  PYTHONUTF8: '1'
  PROJECT_URL: ${{ vars.PROJECT_URL }}
  TELEGRAM_GROUP_URL: ${{ vars.TELEGRAM_GROUP_URL }}
  TELEGRAM_CHANNEL_URL: ${{ vars.TELEGRAM_CHANNEL_URL }}
  VIDEOAPP_RELEASE_TOKEN: ${{ secrets.VIDEOAPP_RELEASE_TOKEN }}

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    secrets: inherit

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout Hongguo module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gentoobreaking/video-src
          path: video-src
          token: ${{ secrets.MODULE_SOURCE_TOKEN != '' && secrets.MODULE_SOURCE_TOKEN || github.token }}
      - name: Stage Hongguo module
        run: mkdir -p bundled-modules && cp -r video-src/hongguo bundled-modules/hongguo
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未配置簽名 Secrets，拒絕發布 debug 簽名的 APK。" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build Android
        run: python scripts/build_android.py
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Verify APK signature
        shell: bash
        env:
          CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
          CERT_VARIABLE: SIGNING_CERT_SHA256
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$expected" ]; then
            echo "未設置倉庫變量 $CERT_VARIABLE，無法確認發布證書。" >&2
            exit 1
          fi
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1 || true)
          if [ -z "$apksigner" ]; then
            sdkmanager 'build-tools;35.0.0' >/dev/null
            apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n1)
          fi
          echo "apksigner：$apksigner"
          "$apksigner" --version || true
          for apk in dist/android/*.apk; do
            echo "== $(basename "$apk")"
            output=$("$apksigner" verify --print-certs "$apk" 2>&1 || true)
            printf '%s\n' "$output"
            if ! printf '%s' "$output" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep "$expected" >/dev/null; then
              echo "簽名證書與發布證書不一致，已終止。" >&2
              exit 1
            fi
          done
      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download Android artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android
          path: release
      - name: Create Android Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}-android
          SIGNING_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          版本 ${VERSION}。安裝包內置紅果站源，其餘站源在 設定 › 站源 › 模組管理 的模組商店安裝。

          Android：
          - *-arm64-v8a.apk：適用於較新的安卓設備
          - *-armeabi-v7a.apk：適用於較舊的安卓設備，電視推薦使用此版本
          - *-x86_64.apk：適用於模擬器

          Android 簽名證書 SHA-256：${SIGNING_CERT_SHA256}
          EOF
          changes="$(awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md)"
          printf '%s' "$changes" > changes.md
          if [ -z "$changes" ]; then
            echo "CHANGELOG.md 中找不到「## ${VERSION}」小節，拒絕發布沒有更新說明的版本。" >&2
            exit 1
          fi
          { printf '更新內容：\n\n%s\n\n' "$changes"; cat notes.md; } > notes.tmp
          mv notes.tmp notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "影片庫 ${VERSION} (Android)" --notes-file notes.md
      - name: Notify Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && vars.TELEGRAM_CHAT_ID != '' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}-android
        run: |
          set -euo pipefail
          changes="$(cat changes.md)"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          text="影片庫 ${VERSION} (Android) 已發布"
          if [ -n "$changes" ]; then
            text="$(printf '%s\n\n更新內容：\n\n%s' "$text" "${changes:0:3500}")"
          fi
          text="$(printf '%s\n\n下載：%s' "$text" "$url")"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null